# Cloud Build - BooksKDP
# =======================
# Constroi e faz deploy no Cloud Run Jobs

steps:
  # Build da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/booksKDP:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/booksKDP:latest'
      - '.'

  # Push para Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/booksKDP:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/booksKDP:latest'

  # Deploy como Cloud Run Job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'bookskdp-pipeline'
      - '--image=gcr.io/$PROJECT_ID/booksKDP:latest'
      - '--region=us-central1'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--task-timeout=3600s'
      - '--max-retries=1'
      - '--set-env-vars=BUCKET_NAME=bookskdp-${PROJECT_ID}'
      - '--set-secrets=GEMINI_API_KEY=gemini-api-key:latest'

images:
  - 'gcr.io/$PROJECT_ID/booksKDP:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/booksKDP:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
